# Apache local en Arch, sin XAMPP. El módulo PHP no es seguro con hilos: usa prefork.
ServerRoot "/etc/httpd"
DefaultRuntimeDir "/home/ariel/Escritorio/UAGRM/6to Semestre/Sistemas de informacion 1/2doExamen/sistema-medico/G6-ClinicaVidaSalud-Si1/apache/run"
Listen 127.0.0.1:8080
ServerName localhost
PidFile "/home/ariel/Escritorio/UAGRM/6to Semestre/Sistemas de informacion 1/2doExamen/sistema-medico/G6-ClinicaVidaSalud-Si1/apache/run/httpd.pid"

LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule php_module modules/libphp.so

User ariel
Group ariel

TypesConfig conf/mime.types
ErrorLog "/home/ariel/Escritorio/UAGRM/6to Semestre/Sistemas de informacion 1/2doExamen/sistema-medico/G6-ClinicaVidaSalud-Si1/apache/run/error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "/home/ariel/Escritorio/UAGRM/6to Semestre/Sistemas de informacion 1/2doExamen/sistema-medico/G6-ClinicaVidaSalud-Si1/apache/run/access.log" common

Include conf/extra/php_module.conf

DocumentRoot "/home/ariel/Escritorio/UAGRM/6to Semestre/Sistemas de informacion 1/2doExamen/sistema-medico/G6-ClinicaVidaSalud-Si1/public"
<Directory "/home/ariel/Escritorio/UAGRM/6to Semestre/Sistemas de informacion 1/2doExamen/sistema-medico/G6-ClinicaVidaSalud-Si1/public">
