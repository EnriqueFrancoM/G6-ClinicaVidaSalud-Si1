services:
  - type: web
    name: clinica-vida-salud
    runtime: docker
    region: virginia
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: Clínica Vida Salud
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: clinica-vida-salud-db
          property: connectionString
      - key: SEED_INITIAL_PASSWORD
        sync: false
      - key: APP_KEY
        generateValue: true
      # CU20: correo de recordatorios (opcional; sin él los envíos por correo quedan FALLIDO)
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      # Brevo: SMTP (login + clave xsmtpsib-) o API REST (xkeysib- + remitente). MAIL_HOST gana si existe.
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Clínica Vida Salud
      - key: RECORDATORIO_CANAL
        value: auto
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE
        sync: false
      - key: WHATSAPP_TEMPLATE_IDIOMA
        value: es
      - key: WHATSAPP_TEMPLATE_MODO
        value: campos
      - key: WHATSAPP_PREFIJO
        value: "591"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini

databases:
  - name: clinica-vida-salud-db
    databaseName: vida_salud
    user: vida_salud
    region: virginia
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
