services:
  - type: web
    name: clinica-vida-salud
    runtime: docker
    region: virginia
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: Clínica Vida Salud
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: clinica-vida-salud-db
          property: connectionString
      - key: SEED_INITIAL_PASSWORD
        sync: false
      - key: APP_KEY
        generateValue: true
      # CU20: correo de recordatorios (opcional; sin él los envíos por correo quedan FALLIDO)
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: clinica-vida-salud-db
    databaseName: vida_salud
    user: vida_salud
    region: virginia
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
